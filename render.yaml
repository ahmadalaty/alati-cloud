services:
  - type: web
    name: alati-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    # standard is 2GB. starter is 512MB, which no 768px resnet50 fits in: v6
    # peaks at 1,141MB and v8 (the v6+v7b ensemble) at 1,299MB, both measured.
    # That ceiling is why f41beda and bd024f6 died during startup rather than
    # serving. v8 has ~700MB of headroom here at ~900ms/image on CPU.
    plan: standard
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alati-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

      # Public URL of this service — used to build links in emails (e.g.
      # email verification). Must match the actual live domain below.
      - key: APP_URL
        value: https://alati-api.onrender.com

      # Model selection.
      #
      # MODEL_VERSION must be set explicitly. inference.py defaults it to "v6",
      # and v6 loads its weights at module import - before uvicorn binds a port -
      # peaking at ~1.14GB against this plan's 512MB. The container is killed
      # during startup, so the deploy fails rather than degrading: f41beda and
      # bd024f6 both died this way and never reached production. v1 is a 224px
      # resnet18 and starts fine.
      #
      # v8 (the calibrated v6+v7b ensemble, ~1.3GB) needs plan: standard and the
      # v7b weights committed. Changing this value is then the whole switch.
      - key: MODEL_VERSION
        value: v1

      - key: MODEL_VARIANT
        value: resnet18

      # Daily scan limits (free vs premium tier)
      - key: FREE_DAILY_LIMIT
        value: "5"
      - key: PREMIUM_DAILY_LIMIT
        value: "50"

      # Paddle billing (set these in the Render dashboard — not committed)
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_PRICE_ID_PREMIUM
        sync: false
      - key: PADDLE_ENV
        value: production

databases:
  - name: alati-db
    plan: basic-256mb
    diskSizeGB: 15
